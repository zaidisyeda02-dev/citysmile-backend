<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Admin Panel, CitySmile Dental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; --bg: #f2f9fe; --surface: #ffffff; --text: #17303f; --dim: #5b7280; --border: #d7e8f2; --sky: #2f9be0; --sky-deep: #1f6fb2; --sky-soft: #e8f4fc; --sans: "Inter", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }
      a { color: inherit; }
      .wrap { max-width: 72rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
      .site-header { position: sticky; top: 0; z-index: 40; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, .96); }
      .header-inner { display: flex; align-items: center; justify-content: space-between; padding: .75rem 1rem; }
      .logo { font-size: 20px; font-weight: 800; text-decoration: none; }
      .logo b { color: var(--sky); }
      .nav-btn { padding: .5rem; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sky-deep); background: none; border: none; cursor: pointer; font-family: inherit; text-decoration: none; font-weight: 700; }
      h1 { font-size: 2rem; font-weight: 800; text-align: center; margin: 0; }
      .sub { margin: .5rem 0 0; text-align: center; font-size: 15px; color: var(--dim); }
      .panel { border: 1px solid var(--border); background: var(--surface); padding: 1.5rem 1.25rem; border-radius: 1rem; }
      .field-label { display: block; margin-bottom: .375rem; font-size: .875rem; font-weight: 700; }
      .field-input { width: 100%; border: 1px solid var(--border); background: var(--white); padding: .75rem 1rem; font-size: 15px; color: var(--text); outline: none; font-family: inherit; border-radius: .75rem; }
      .field-input:focus { border-color: var(--sky); }
      .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; background: var(--sky); padding: .75rem 1.5rem; font-size: .875rem; font-weight: 700; letter-spacing: .08em; color: #fff; border: none; cursor: pointer; font-family: inherit; border-radius: 999px; }
      .btn-primary:hover { background: var(--sky-deep); }
      .btn-block { width: 100%; }
      .form-error { color: #b3261e; font-size: .875rem; }
      .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .admin-table th, .admin-table td { text-align: left; padding: .625rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
      .admin-table th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
      .admin-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.5rem; }
      .admin-tab { padding: .625rem 1.25rem; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; background: var(--white); color: var(--text); cursor: pointer; font-family: inherit; font-weight: 700; }
      .admin-tab.active { background: var(--sky); border-color: var(--sky); color: #fff; }
      .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-top: 1.5rem; }
      @media (max-width: 640px) { .stat-grid { grid-template-columns: 1fr; } }
      .stat-card { padding: 1.25rem; text-align: center; }
      .stat-card .num { font-size: 32px; font-weight: 800; margin: 0; }
      .stat-card .lbl { margin: .25rem 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
      .table-wrap { overflow-x: auto; margin-top: 1rem; }
      select.field-input { width: auto; padding: .5rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a href="/" class="logo">CitySmile <b>Dental</b></a>
        <div>
          <a href="/" class="nav-btn">Site</a>
          <button type="button" class="nav-btn" id="sign-out-btn" style="display:none">Sign out</button>
        </div>
      </div>
    </header>
    <main class="wrap" style="padding-top:2rem;padding-bottom:3rem">
      <h1>Admin Panel</h1>
      <p class="sub">Appointments, messages and subscribers for CitySmile Dental.</p>
      <div id="admin-root" style="margin-top:2rem"></div>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
